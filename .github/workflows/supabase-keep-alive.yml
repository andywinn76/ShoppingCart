name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 * * 1,4'   # Mondays and Thursdays, 12:00 UTC
  workflow_dispatch:          # lets you run it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o body.txt -w "%{http_code}" \
            "$URL/rest/v1/keep_alive?select=last_ping" \
            -H "apikey: $KEY")
          echo "HTTP $status"
          cat body.txt
          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive failed with status $status"
            exit 1
          fi
